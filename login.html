<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAREER GRASPP - Login Portal</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --card-bg: #ffffff;
            --accent-blue: #1e3a8a;
            --accent-gold: #d97706;
            --accent-green: #16a34a;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Top Brand Header */
        .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .login-brand img {
            height: 52px;
            width: auto;
            border-radius: 8px;
        }

        /* Card Container */
        .login-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.8rem;
        }

        /* Role Switcher Tabs */
        .role-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
            margin-bottom: 1.5rem;
        }

        .role-btn {
            padding: 0.6rem 0.4rem;
            border: none;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .role-btn i {
            font-size: 1rem;
        }

        .role-btn.active {
            background: #ffffff;
            color: var(--accent-blue);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            outline: none;
            font-size: 0.92rem;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-blue);
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        .back-home-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-home-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Top Brand Header -->
    <a href="index.html" class="login-brand">
        <img src="grasp.jpg" alt="CAREER GRASPP Logo"
             onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'220\' height=\'52\' viewBox=\'0 0 220 52\'><rect width=\'220\' height=\'52\' fill=\'%230b1120\' rx=\'6\'/><text x=\'15\' y=\'32\' font-family=\'sans-serif\' font-size=\'20\' font-weight=\'bold\' fill=\'%23eab308\'>CAREER</text><text x=\'110\' y=\'32\' font-family=\'sans-serif\' font-size=\'20\' font-weight=\'bold\' fill=\'%232563eb\'>GRASPP</text></svg>';">
    </a>

    <!-- Login Card -->
    <div class="login-card">
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to access your training portal</p>

        <!-- Role Selector -->
        <div class="role-tabs">
            <button class="role-btn active" id="btn-admin" onclick="selectRole('admin')">
                <i class="fa-solid fa-user-shield"></i> Admin
            </button>
            <button class="role-btn" id="btn-student" onclick="selectRole('student')">
                <i class="fa-solid fa-user-graduate"></i> Student
            </button>
            <button class="role-btn" id="btn-org" onclick="selectRole('org')">
                <i class="fa-solid fa-building-columns"></i> Partner Org
            </button>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)">
            <input type="hidden" id="selectedRole" value="admin">

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="loginEmail" value="Careergraspp@gmail.com" placeholder="name@domain.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" value="Kumar@2422" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Login to Portal
            </button>
        </form>
    </div>

    <a href="index.html" class="back-home-link">
        <i class="fa-solid fa-arrow-left"></i> Return to Main Website
    </a>

    <script>
        function selectRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${role}`).classList.add('active');
            document.getElementById('selectedRole').value = role;
        }

        function handleLogin(event) {
            event.preventDefault();

            const role = document.getElementById('selectedRole').value;
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // Route dynamically based on selected role
            if (role === 'org') {
                window.location.href = 'organization.html';
            } else if (role === 'student') {
                window.location.href = 'courses.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
